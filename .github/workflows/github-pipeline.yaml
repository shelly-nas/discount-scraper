name: Discount Scraper Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug-dns:
    name: Debug DNS and Registry Access
    runs-on: shelly
    steps:
      - run: |
          echo "=== identity ==="
          hostname; whoami; readlink -f /proc/$$/exe
          echo "=== resolv.conf ==="
          cat /etc/resolv.conf
          echo "=== hosts ==="
          cat /etc/hosts
          echo "=== getent ==="
          getent hosts registry.shelly-nas.nl || echo "NO RESOLVE"
          echo "=== docker daemon ==="
          docker info 2>&1 | grep -i -A3 'insecure\|server version'
          echo "=== pull test ==="
          docker pull registry.shelly-nas.nl/discount-scraper-db:latest || echo "PULL FAILED"

  build-database:
    name: Build and Push Database
    uses: shelly-nas/shared-workflows/.github/workflows/build-push.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/discount-scraper-db:latest
      context: database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
  
  build-scraper:
    name: Build and Push Scraper API
    uses: shelly-nas/shared-workflows/.github/workflows/build-push.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/discount-scraper-api:latest
      context: scraper
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
  
  build-web:
    name: Build and Push Web
    uses: shelly-nas/shared-workflows/.github/workflows/build-push.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/discount-scraper-web:latest
      context: web
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy:
    name: Deploy from Registry
    needs: [build-database, build-scraper, build-web]
    if: ${{ success() }}
    uses: shelly-nas/shared-workflows/.github/workflows/deploy.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/discount-scraper
      compose_file: docker-compose.prod.yml
      image_tag: latest
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME }}
        DB_USER=${{ vars.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}
