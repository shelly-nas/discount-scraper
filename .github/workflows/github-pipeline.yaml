name: Supermarket Scraper Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-database:
    name: Build and Push Database
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/supermarket-scraper-db:latest
      context: database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
  
  build-scraper:
    name: Build and Push Scraper API
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/supermarket-scraper-api:latest
      context: scraper
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
  
  build-web:
    name: Build and Push Web
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/supermarket-scraper-web:latest
      context: web
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  # The app was deployed as discount-scraper until October 2026. Its stacks in
  # the old directories hold the same ports, so they are stopped before the
  # supermarket-scraper stack starts. Nothing is deleted: the old directories
  # stay, and the production database volume (discount-scraper_postgres_data,
  # pinned in docker-compose.prod.yml) is checked to exist so the new stack
  # can never start on an empty database. Safe to run again: stopping a
  # stopped stack does nothing.
  retire-discount-scraper:
    name: Stop the stack deployed as discount-scraper
    needs: [build-database, build-scraper, build-web]
    runs-on: shelly
    steps:
      - name: Check the production database volume
        run: |
          docker volume inspect discount-scraper_postgres_data > /dev/null \
            || { echo "::error::Volume discount-scraper_postgres_data not found; not deploying on an empty database"; exit 1; }
      - name: Stop the old stacks
        run: |
          for dir in /volume1/docker/discount-scraper /volume1/docker/discount-scraper-acc; do
            if [ -f "$dir/docker-compose.yaml" ]; then
              echo "Stopping the stack in $dir"
              (cd "$dir" && docker compose down --remove-orphans)
            fi
          done

  deploy:
    name: Deploy from Registry
    needs: [build-database, build-scraper, build-web, retire-discount-scraper]
    if: ${{ success() }}
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-production.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/supermarket-scraper
      compose_file: docker-compose.prod.yml
      image_tag: latest
      # Pinned in docker-compose.prod.yml; created when missing, never removed.
      persistent_volumes: discount-scraper_postgres_data
      # Fallback teardown of acc once what runs there is in production.
      acc_directory: /volume1/docker/supermarket-scraper-acc
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME }}
        DB_USER=${{ vars.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}
