services:
  postgres:
    image: ${REGISTRY}/supermarket-scraper-db:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Persist data
      - postgres_data:/var/lib/postgresql/data
    restart: always

  scraper-api:
    image: ${REGISTRY}/supermarket-scraper-api:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CATALOG_ENABLED: ${CATALOG_ENABLED:-true}
      CATALOG_CRON: ${CATALOG_CRON:-17 3 * * 1}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
    # Joined to shelly-network so the Baskit web container can proxy
    # /api/discounts to the public API. Baskit uses the name from before the
    # rename to supermarket-scraper (http://discount-scraper-api:3001), kept
    # as an alias until Baskit moves to supermarket-scraper-api.
    networks:
      shelly-network:
        aliases:
          - discount-scraper-api
      default:

  web:
    image: ${REGISTRY}/supermarket-scraper-web:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-web
    ports:
      - "8090:80"
    depends_on:
      - scraper-api
    restart: always
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      # Two networks: tell Traefik which one to use, or it may answer 504.
      - "traefik.docker.network=shelly-network"
      - "traefik.http.routers.supermarkets.rule=Host(`supermarkets.shelly-nas.nl`)"
      - "traefik.http.routers.supermarkets.entrypoints=web"
      - "traefik.http.services.supermarkets.loadbalancer.server.port=80"

volumes:
  # The production data lives in the volume compose created when the stack was
  # deployed from /volume1/docker/discount-scraper. Its name is pinned so the
  # stack keeps that data after the rename to supermarket-scraper; the deploy
  # checks it exists first (github-pipeline.yaml).
  postgres_data:
    external: true
    name: discount-scraper_postgres_data

networks:
  shelly-network:
    external: true
